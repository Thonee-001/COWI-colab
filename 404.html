        </defs>
        <circle cx="92" cy="118" r="28" fill="#f7d9a9"/>

    <div class="error-content">
      <img src="./Images/Logo/logoVariant-2.png" alt="COWI Logo" class="error-logo">
      <p class="error-tag">404 Error</p>
      <h1>Page not found</h1>
      <p class="error-message">
        The page you’re looking for may have moved, been removed, or never existed.
      </p>

      <div class="error-actions">
        <a class="back-home-btn" href="./index.html">
          <button type="button">Back to homepage</button>
        </a>
      </div>

      <p class="redirect-note">Redirecting to the homepage in <span id="countdown">5</span> seconds...</p>
    </div>
  </div>

  <script>
    const countdown = document.getElementById('countdown');
    let timeLeft = 5;

    const timer = setInterval(() => {
      timeLeft -= 1;
      if (countdown) {
        countdown.textContent = timeLeft;
      }

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = './index.html';
      }
    }, 1000);
  </script>
